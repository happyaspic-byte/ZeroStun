[package]
name = "zerostun"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
fastcdc = "5.0.0"
fs4 = "1.1.0"
getrandom = "0.4.3"
hex = "0.4.3"
indicatif = "0.18.6"
lz4_flex = "0.14.0"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"
