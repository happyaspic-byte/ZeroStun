[toolchain]
# Release/build pin. Cargo.toml retains the declared 1.85 MSRV policy; the
# locked graph currently requires a later compiler through redb, fastcdc, and
# criterion. CI tests this pin rather than claiming a 1.85 compile pass.
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
