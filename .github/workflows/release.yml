name: release-artifacts

# Third-party action policy: every action is pinned to an immutable commit SHA.
# Major tags are recorded only as comments. Updates require a source-policy
# review. This workflow never creates a tag or GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Packaging test mode. Never publishes or creates tags.
        required: true
        default: test
        type: choice
        options:
          - test

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package:
    name: package-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Validate tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])
          PY
          )
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --lib --bins --tests --all-features --locked -- --test-threads=1
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check licenses sources bans advisories
      - name: Build package
        run: scripts/package-release.sh --target "${{ matrix.target }}" --output-dir dist
      - name: Upload archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerostun-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
